on:
  workflow_dispatch:
  schedule:
    # every day at 8 PM UTC
    - cron: "0 20 * * *"

name: "🔄 Scheduled Transifex Update"

jobs:
  pull-translations-from-transifex:
    name: pull-translations-from-transifex

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 🌐 Push source file using transifex client
        uses: transifex/cli-action@v2
        with:
          token: ${{ secrets.TRANSIFEX_TOKEN }}
          args: pull --force --all --mode onlytranslated --minimum-perc 1
      # `--mode onlytranslated` still writes untranslated strings as `key=`, and Spring would use that empty
      # value instead of falling back to a less specific locale or English. This removes them from the files
      # the pull wrote. The `:` covers uncaughtException.programmerError: its source value starts with `:`,
      # which Transifex reads as part of the separator, so it comes back as `key=: ` when untranslated.
      - name: 🧹 Remove untranslated strings
        run: |
          git status --porcelain --untracked-files=all -- 'api/src/main/resources/messages_*.properties' \
            | cut -c4- \
            | xargs -r sed -i -E '/^[^#![:space:]][^=]*=[[:space:]:]*$/d'
      - name: 🔄 Create PR if necessary
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "(chore) Update translations from Transifex"
          title: "(chore) Update translations from Transifex"
          body: "Automated updates of translations pulled from Transifex"
          branch: "chore/update-transifex"
          author: "OpenMRS Bot <infrastructure@openmrs.org>"
          token: ${{ secrets.OMRS_BOT_GH_TOKEN }}
      - name: ✅ Auto approve PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔀 Automerge PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.OMRS_BOT_GH_TOKEN }}
