name: "OWASP Dependency Check"
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  dependencycheck:
    runs-on: ubuntu-latest
    # a stalled NVD feed download otherwise runs until the 6 hour GitHub default; normal runs
    # take 3-8 minutes with occasional NVD-update tails up to ~35, so 60 clears the worst observed
    timeout-minutes: 60
    name: dependencycheck_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java version
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project with Maven
        run: mvn clean install -DskipTests -Dspotbugs.skip=true

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        id: depcheck
        env:
          JAVA_HOME: /opt/jdk
        with:
          project: 'openmrs-core'
          path: '.'
          format: 'ALL'
          out: 'reports'
          # --disableCentral avoids flaky Central-search timeouts (the analyzer
          # can stall for 30+ min). --disableOssIndex is a no-op here (the
          # analyzer auto-disables without credentials).
          args: |
            --failOnCVSS 9.0
            --enableRetired
            --disableCentral
            --disableOssIndex
            --suppression dependency-check-suppressions.xml
            ${{ secrets.NVD_API_KEY != '' && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Dependency Check report
          path: ${{ github.workspace }}/reports
