# Default (overridable) with runtime properties file

# Connection Properties -->
hibernate.connection.username=test
hibernate.connection.password=test
hibernate.connection.driver_class=com.mysql.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/openmrs?autoReconnect=true

# Hibernate specific connection/debug properties
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.lazy=true
hibernate.dialect.storage_engine=innodb

# Hibernate specific connection pool properties		
hibernate.c3p0.max_size=50
hibernate.c3p0.min_size=0
hibernate.c3p0.timeout=100
hibernate.c3p0.max_statements=0
hibernate.c3p0.idle_test_period=3000
hibernate.c3p0.acquire_increment=1
# fail a connection checkout after 30s instead of waiting forever (the c3p0 default);
# an exhausted pool otherwise freezes every waiting thread permanently, see TRUNK-6465.
# to override in runtime properties the key must stay camelCase (checkoutTimeout);
# an underscore form like checkout_timeout is silently ignored by hibernate-c3p0
hibernate.c3p0.checkoutTimeout=30000

# Hibernate debugging options
hibernate.generate_statistics=true
hibernate.cache.use_structured_entries=false

# Hibernate cache
hibernate.cache.use_second_level_cache=true
hibernate.cache.use_query_cache=true
hibernate.cache.region.factory_class=infinispan
hibernate.cache.default_cache_concurrency_strategy=read-write
# hibernate.cache.infinispan.cfg is configured by HibernateSessionFactoryBean based on cache_type property

# Preserve the cache lifetimes and maximum sizes used by the 2.6.x Hibernate second-level caches.
hibernate.cache.infinispan.org.openmrs.Concept.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.Concept.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.Concept.eviction.max_entries=10000

hibernate.cache.infinispan.org.openmrs.GlobalProperty.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.GlobalProperty.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.GlobalProperty.eviction.max_entries=1000

hibernate.cache.infinispan.org.openmrs.User.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.User.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.User.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.Role.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.Role.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.Role.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.Privilege.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.Privilege.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.Privilege.eviction.max_entries=500

hibernate.cache.infinispan.org.openmrs.Person.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.Person.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.Person.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.PersonName.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.PersonName.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.PersonName.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.PersonAddress.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.PersonAddress.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.PersonAddress.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.PersonAttribute.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.PersonAttribute.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.PersonAttribute.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.ConceptDatatype.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.ConceptDatatype.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.ConceptDatatype.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.ConceptClass.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.ConceptClass.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.ConceptClass.eviction.max_entries=100

hibernate.cache.infinispan.org.openmrs.Location.expiration.max_idle=-1
hibernate.cache.infinispan.org.openmrs.Location.expiration.lifespan=-1
hibernate.cache.infinispan.org.openmrs.Location.eviction.max_entries=100

# Needs to be set to elasticsearch or lucene
hibernate.search.backend.type=lucene
hibernate.search.backend.analysis.configurer=luceneConfig
#hibernate.search.backend.type=elasticsearch
#hibernate.search.backend.analysis.configurer=elasticsearchConfig

hibernate.search.mapping.build_missing_discovered_jandex_indexes=false

# Hibernate Search Lucene backend
hibernate.search.backend.directory.type=local-filesystem
hibernate.search.backend.directory.root=%APPLICATION_DATA_DIRECTORY%/lucene/indexes

# Hibernate Search Elasticsearch backend
hibernate.search.backend.uris=http://es:9200
hibernate.search.backend.discovery.enabled=true
hibernate.search.backend.discovery.refresh_interval=10
hibernate.search.backend.schema_management.settings_file=org/openmrs/api/db/hibernate/search/elasticsearch/es-index-settings.json

hibernate.jdbc.batch_size=50
hibernate.order_inserts=true
hibernate.order_updates=true

#For Backward Compatibility of Sequences after Hibernate 5


# Hibernate envers options
hibernate.integration.envers.enabled=false
org.hibernate.envers.revision_listener=org.openmrs.api.db.hibernate.envers.OpenmrsRevisionEntityListener
org.hibernate.envers.audit_table_suffix=_audit
